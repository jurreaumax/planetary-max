name = "planetary-max"
main = "src/index.ts"
compatibility_date = "2024-09-20"
compatibility_flags = ["nodejs_compat"]

# Default environment (used by `wrangler deploy`)
# Production environment (used by `wrangler deploy --env production`)
[env.production]
name = "planetary-max-production"
main = "src/index.ts"
compatibility_date = "2024-09-20"
compatibility_flags = ["nodejs_compat"]

# Add bindings here if needed:
# KV, DO, R2, D1, Queues, Secrets, etc.
#
# Example:
# [[env.production.kv_namespaces]]
# binding = "MY_KV"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
#
# [[env.production.durable_objects.bindings]]
# name = "MY_OBJECT"
# class_name = "MyDurableObject"
#
# [env.production.r2_buckets]
# MY_BUCKET = { bucket_name = "my-bucket" }
