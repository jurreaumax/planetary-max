name = "planetary-max"
main = "src/index.ts"
compatibility_date = "2024-09-20"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "PORTAL_KERNEL", class_name = "PortalKernel" }
]

[migrations]
