name = "planetary-max"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[build]
command = "npm run build"
cwd = "."

[observability]
enabled = true

# Top-level vars intentionally omitted — Wrangler does NOT inherit them into env.production

[env.production]
name = "planetary-max"
workers_dev = true

[env.production.vars]
API_BASE_URL = "https://planetary-max.jurreaumax.workers.dev"
MAXOS_MODULE = "local"
PLANETARY_MODE = "single"
UMBRELLA_ENFORCEMENT = "strict"
