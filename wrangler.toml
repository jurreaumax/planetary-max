name = "planetary-max"
main = "src/index.ts"
compatibility_date = "2024-09-01"
workers_dev = true
compatibility_flags = [
  "nodejs_compat",
  "global_fetch_strictly_public"
]

# ============================================================
# Environment Variables (Worker-side)
# ============================================================
[vars]
API_BASE_URL = "https://planetary-max.jurreaumax.workers.dev"

MAXOS_MODULE = "local"
PLANETARY_MODE = "single"
UMBRELLA_ENFORCEMENT = "strict"



# ============================================================
# Build Configuration
# ============================================================
[build]
command = "npm run build"
cwd = "."

# ============================================================
# CORS (Umbrella Edge)
# ============================================================
[observability]
enabled = true

