name = "planetary-max"
main = "src/index.ts"
compatibility_date = "2024-09-20"
compatibility_flags = ["nodejs_compat"]

# Your Worker runs Hono + Vite bundle output.
# Cloudflare Workers Deployments will auto‑bundle using Wrangler.

# Bindings for production environment
[env.production]
name = "planetary-max-production"
main = "src/index.ts"
compatibility_date = "2024-09-20"
compatibility_flags = ["nodejs_compat"]

# KV, Durable Objects, R2, D1, Queues, etc.
# Add these only if your Worker uses them.
# Example structure (commented out):
#
# [[env.production.kv_namespaces]]
# binding = "MY_KV"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
#
# [[env.production.durable_objects.bindings]]
# name = "MY_OBJECT"
# class_name = "MyDurableObject"
#
# [env.production.r2_buckets]
# MY_BUCKET = { bucket_name = "my-bucket" }

# If you use secrets, Wrangler will manage them automatically:
# wrangler secret put MY_SECRET
