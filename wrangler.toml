name = "planetary-max"
main = "src/index.ts"
compatibility_date = "2024-09-20"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# Durable Object: Portal Kernel (REQUIRED)
# ============================================================
[durable_objects]
bindings = [
  { name = "PORTAL_KERNEL", class_name = "PortalKernel" }
]

# ============================================================
# Environment Variables (Portal-OS runtime)
# ============================================================
[vars]
PORTAL_ENV = "production"
PORTAL_KERNEL_SERVICE = "portal-kernel"
PORTAL_IDENTITY_MODE = "strict"
PORTAL_ROUTING = "edge"

# ============================================================
# Production Environment
# ============================================================
[env.production]
name = "planetary-max-production"
main = "src/index.ts"
compatibility_date = "2024-09-20"
compatibility_flags = ["nodejs_compat"]

[env.production.vars]
PORTAL_ENV = "production"
PORTAL_KERNEL_SERVICE = "portal-kernel"
PORTAL_IDENTITY_MODE = "strict"
PORTAL_ROUTING = "edge"

[[env.production.durable_objects.bindings]]
name = "PORTAL_KERNEL"
class_name = "PortalKernel"
